name: Build Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Test
        run: |
          npm ci
          npx eslint .
          npm run test:unit -- --run

      # Build without publishing yet
      - name: Build Package
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then npm run dist:mac -- --publish never; fi
          if [ "${{ matrix.os }}" == "windows-latest" ]; then npm run dist:win -- --publish never; fi
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then npm run dist:linux -- --publish never; fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-installers
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-installers/*.exe
            all-installers/*.dmg
            all-installers/*.AppImage
            all-installers/*.msi
            all-installers/*.yml
            all-installers/*.blockmap
          draft: true # Set to false if you want it published immediately
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
